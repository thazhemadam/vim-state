name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Current dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check packages
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Inspect package contents
        run: npm run check:packages

  minimum-pi:
    name: Minimum Pi compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install minimum supported Pi
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps \
            @earendil-works/pi-coding-agent@0.79.8 \
            @earendil-works/pi-tui@0.79.8
          rm -rf .turbo packages/vim-state/dist packages/integrations/pi-vim/dist

      - name: Verify Pi versions
        run: |
          test "$(node -p "require('./node_modules/@earendil-works/pi-coding-agent/package.json').version")" = "0.79.8"
          test "$(node -p "require('./node_modules/@earendil-works/pi-tui/package.json').version")" = "0.79.8"

      - name: Check against minimum Pi
        run: npm run check

      - name: Test against minimum Pi
        run: npm test
