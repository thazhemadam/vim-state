name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Current dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check packages
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Inspect package contents
        run: npm run check:packages

  minimum-pi:
    name: Minimum Pi compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install minimum supported Pi
        run: |
          node scripts/checks/set-pi-development-version.mjs 0.79.8
          npm install --package-lock=false --legacy-peer-deps
          rm -rf .turbo packages/vim-state/dist packages/integrations/pi-vim/dist

      - name: Verify Pi versions
        env:
          EXPECTED_PI_VERSION: 0.79.8
        run: node scripts/checks/pi-development-version.mjs

      - name: Check against minimum Pi
        run: npm run check

      - name: Test against minimum Pi
        run: npm test

  latest-pi:
    name: Latest Pi compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install latest Pi
        run: |
          pi_version="$(npm view @earendil-works/pi-coding-agent@latest version)"
          test "$pi_version" = "$(npm view @earendil-works/pi-tui@latest version)"
          node scripts/checks/set-pi-development-version.mjs "$pi_version"
          npm install --package-lock=false --legacy-peer-deps
          echo "EXPECTED_PI_VERSION=$pi_version" >> "$GITHUB_ENV"
          rm -rf .turbo packages/vim-state/dist packages/integrations/pi-vim/dist

      - name: Verify installed Pi version
        run: node scripts/checks/pi-development-version.mjs

      - name: Check against latest Pi
        run: npm run check

      - name: Test against latest Pi
        run: npm test
